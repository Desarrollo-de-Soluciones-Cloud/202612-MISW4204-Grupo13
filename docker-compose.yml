version: "3.9"

services:
  seneprojects_backend:
    build: ./backend
    container_name: seneprojects_backend
    env_file:
      - .env
    depends_on:
      - seneprojects_db

  seneprojects_nginx:
    build: ./nginx
    container_name: seneprojects_nginx
    ports:
      - "80:80"
    depends_on:
      - seneprojects_backend

  seneprojects_db:
    image: postgres:15
    container_name: seneprojects_db
    restart: always
    environment:
      POSTGRES_USER: seneprojects_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - seneprojects_data:/var/lib/postgresql/data

volumes:
  seneprojects_data: