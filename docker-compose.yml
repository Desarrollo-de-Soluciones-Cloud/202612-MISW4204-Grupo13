services:
  seneprojects_backend:
    build: ./backend
    container_name: seneprojects_backend
    env_file:
      - .env
      - .env.admin
    expose:
      - "8080"
    restart: on-failure

  seneprojects_frontend:
    build:
      context: ./frontend
    container_name: seneprojects_frontend
    expose:
      - "5173"
    restart: on-failure

  seneprojects_nginx:
    build: ./nginx
    container_name: seneprojects_nginx
    ports:
      - "80:80"
    depends_on:
      - seneprojects_backend
      - seneprojects_frontend
    restart: on-failure