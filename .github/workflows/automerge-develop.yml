name: automerge-develop

on:
  workflow_run:
    workflows:
      - tests
    types:
      - completed

permissions:
  contents: write

jobs:
  automerge:
    name: automerge into develop
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'feat/') &&
      contains(github.event.workflow_run.head_commit.message, 'merge develop')
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: merge feat branch into develop
        uses: tukasz/direct-merge-action@master
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          source-branch: ${{ github.event.workflow_run.head_branch }}
          target-branch: develop
